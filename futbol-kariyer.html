<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Futbol Kariyer Yolu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: gece maçı skorbord hissi — solda yapışkan oyuncu kartı, sağda sezon akışı, transferde tam ekran pencere */
:root{
  --bg:#07130e; --pitch:#0b1c14; --surface:#10251b; --surface2:#163124; --line:#24463a;
  --chalk:#e6efe8; --muted:#8ea79a; --amber:#f0b445; --ink:#1b1305; --gold:#e8c468; --goldbg:#33290f;
  --win:#52c48d; --winbg:#123a29; --loss:#e3664f; --sky:#7fb3e0; --shade:rgba(3,9,6,.86); --stripe:rgba(255,255,255,.014);
  --display:"Big Shoulders Display","Oswald",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:repeating-linear-gradient(90deg,transparent 0 90px,var(--stripe) 90px 180px)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
.eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:.03em}
.brand span{color:var(--amber)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.btn{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:15px;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--chalk);cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 160px}
label{display:flex;flex-direction:column;gap:6px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
input,select{font:500 16px var(--body);color:var(--chalk);background:var(--pitch);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-transform:none;letter-spacing:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.form{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin-block:10px 26px}
.hero h1{font-size:clamp(44px,8vw,92px);font-weight:900}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{color:var(--muted);max-width:52ch;font-size:16px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--chalk)}
.rules b{font-family:var(--display);color:var(--amber);font-size:20px;min-width:34px}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:1fr}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px}
@media(max-width:880px){.side{position:static}}
.pcard{background:linear-gradient(160deg,var(--surface2),var(--surface) 60%);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
.prow{display:flex;gap:14px;align-items:center}
.ovr{font-family:var(--display);font-weight:900;font-size:70px;line-height:.85;color:var(--amber);font-variant-numeric:tabular-nums}
.ovr small{display:block;font-family:var(--cond);font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600;text-align:center;margin-top:4px}
.pname{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.club{font-family:var(--cond);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--pitch);border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media(max-width:420px){.tile b{font-size:24px}}
.stars{color:var(--gold);letter-spacing:2px}
.stars i{color:var(--line);font-style:normal}
.feed{display:grid;gap:16px;min-width:0}
.season{animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.shead h2{font-size:30px}
.lines{display:grid;gap:0;margin-top:12px}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line span:first-child{color:var(--muted)}
.line span:last-child{text-align:right;font-weight:600}
.won{color:var(--gold)}
.lost{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--goldbg);color:var(--gold);border:1px solid var(--gold)}
.chip.g{background:var(--winbg);color:var(--win);border-color:var(--win)}
.chip.r{background:transparent;color:var(--loss);border-color:var(--loss)}
.delta{font-family:var(--cond);font-weight:700}
.up{color:var(--win)} .down{color:var(--loss)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);text-align:left;font-weight:600;background:var(--pitch)}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.overlay{position:fixed;inset:0;background:var(--shade);backdrop-filter:blur(3px);z-index:50;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.win{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.win h2{font-size:clamp(34px,6vw,56px);font-weight:900}
.offers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:520px){.offers{grid-template-columns:1fr}}
.offer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;align-content:start}
.offer:hover{border-color:var(--amber)}
.tag{justify-self:start;font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--amber);color:var(--ink)}
.tag.alt{background:var(--sky)}
.offer h3{font-size:32px;font-weight:900;overflow-wrap:anywhere}
.fee{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fee div{background:var(--pitch);border:1px solid var(--line);border-radius:8px;padding:10px}
.fee b{display:block;font-family:var(--display);font-size:28px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
.fee span{font-family:var(--cond);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--pitch);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--win)}
.note{color:var(--muted);font-size:13px}
/* bitiş ekranı */
.endhero{padding-block:18px 8px;display:grid;gap:10px}
.endhero h1{font-size:clamp(48px,10vw,120px);font-weight:900;overflow-wrap:anywhere}
.legacy{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,38px);color:var(--amber);text-transform:uppercase}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-block:18px}
.big4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:820px){.big4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.big4{grid-template-columns:1fr}}
.trophy{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px;align-content:start}
.trophy.has{border-color:var(--gold);background:linear-gradient(180deg,var(--goldbg),var(--surface) 70%)}
.trophy .cnt{font-family:var(--display);font-weight:900;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.trophy.has .cnt{color:var(--gold)}
.trophy .cnt.zero{color:var(--line)}
.trophy h3{font-size:20px}
.trophy p{margin:0;color:var(--muted);font-size:13px}
.sec{margin-top:30px;display:grid;gap:12px}
.sec>h2{font-size:28px}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cab .row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.cab .row b{font-family:var(--display);font-size:30px;color:var(--gold);min-width:40px;line-height:1}
.cab .row div{min-width:0}
.cab .row strong{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.cab .row small{color:var(--muted);overflow-wrap:anywhere}
.col{max-width:620px;margin:0 auto;display:grid;gap:16px}
.sline{font-size:16px;font-weight:600}
.btn.link{justify-self:center;background:none;border:0;color:var(--muted);font-size:13px}
.offer{font:inherit;color:var(--chalk);text-align:left;cursor:pointer;width:100%}
.offer:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.oname{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1;overflow-wrap:anywhere}
.ofee{font-family:var(--display);font-weight:800;font-size:34px;color:var(--amber);font-variant-numeric:tabular-nums}
.ofee small{display:block;font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.win h2{font-size:clamp(32px,6vw,48px)}
.sh{font-size:24px;margin-top:8px}
.endhero h1{font-size:clamp(40px,9vw,80px)}
.cab{grid-template-columns:1fr}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">

  <main id="app"></main>
</div>

const teamOf=(n,lg)=>LG[lg].teams.find(t=>t.n===n);
const avgPow=l=>l.teams.reduce((a,x)=>a+x.p,0)/l.teams.length;
const topPow=l=>Math.max(...l.teams.map(x=>x.p));
function mv(ovr,age){const af=age<=21?1.5:age<=25?1.25:age<=28?1:age<=30?.7:age<=32?.45:age<=34?.25:.12;return Math.max(.05,.45*Math.exp((ovr-60)*.185)*af)}
function roleOf(rel){return rel>=6?'Takımın yıldızı':rel>=1?'İlk 11 oyuncusu':rel>=-3?'Rotasyon oyuncusu':'Yedek / gelişim'}
const POT_TXT=['','Çok düşük','Düşük','Orta','Yüksek','Çok yüksek'];
function stars(n){return '<span class="stars" aria-label="'+n+' / 5">'+'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i></span>'}
function growth(age,rel,pot,avg,det){
  const r=det?.5:R();let g;
  if(age<=20)g=3+r*3;else if(age<=23)g=1.8+r*2.4;else if(age<=26)g=.4+r*1.4;else if(age<=29)g=-.6+r*1.4;
  else if(age<=31)g=-1.6+r*1.2;else if(age<=33)g=-2.6+r*1.4;else g=-3.6+r*1.6;
  if(age<=24){g+=(pot-3)*.45;if(rel<-4&&g>0)g*=.7}
  if(avg>=7.3&&age<=29)g+=.5;
  return g;
}
function applyG(o,g,cap){return g>0?Math.max(o,Math.min(cap,o+g)):Math.max(40,o+g)}
function rankOf(t){const pr=P.prevRank[t.n];if(pr)return pr;return [...LG[t.lg].teams].sort((a,b)=>b.p-a.p).findIndex(x=>x.n===t.n)+1}
function compFor(t){const l=LG[t.lg],r=rankOf(t),cs=COMPS[l.conf]||[];let acc=0;for(let i=0;i<3;i++){acc+=l.slots[i]||0;if((l.slots[i]||0)>0&&r<=acc)return cs[i]||null}return null}
function simKO(s,st,elim,mp,sc){let m=0;for(let k=0;k<st.length;k++){m+=mp[k];if(R()>sig((s-st[k]+gauss()*1.5)/(sc||3.2)))return{won:false,txt:elim[k],m,r:k}}return{won:true,txt:'ŞAMPİYON',m,r:st.length}}

function newCareer(name,nat,pos){
  return{name,nat,pos,age:17,ovr:rnd(60,65),pot:80+Math.pow(R(),.9)*15,team:null,seasons:[],trophies:[],prevRank:{},contWins:[],moves:[],done:false};
}
function mkOffer(t,tag,start){
  const l=LG[t.lg],rel=P.ovr-t.p,mult=(.82+.07*t.pot)*(.65+.4*l.coef);
  let fee=mv(P.ovr,P.age)*mult*rnd(.92,1.12);
  if(['SAU','QAT','UAE'].includes(l.id))fee*=1.35;
  let o2=applyG(P.ovr,growth(P.age,rel,t.pot,7,true),P.pot);o2=applyG(o2,growth(P.age+1,o2-t.p,t.pot,7,true),P.pot);
  const proj=mv(o2,P.age+2)*mult;
  return{n:t.n,lg:t.lg,tag,fee,proj,o2,role:roleOf(rel),comp:(compFor(t)||{}).n||null,start:!!start};
}
function startOffers(lgId){
  const l=LG[lgId],sorted=[...l.teams].sort((a,b)=>b.p-a.p);
  const big=pick(sorted.slice(0,Math.min(3,sorted.length)));
  const rest=sorted.slice(Math.floor(sorted.length/2)).filter(t=>t!==big);
  const small=wpick(rest.length?rest:sorted.filter(t=>t!==big),t=>t.pot+1);
  return[mkOffer(big,'Dev kulüp altyapısı',1),mkOffer(small,'Hemen forma şansı',1)];
}
function makeOffers(){
  const cur=P.team.n,o=P.ovr,age=P.age,recent=P.seasons.slice(-2);
  const avgR=recent.reduce((a,s)=>a+s.avg,0)/recent.length;
  const tgt=o+clamp((avgR-6.9)*4,-3,4);
  const pool=LEAGUES.flatMap(l=>l.teams).filter(t=>t.n!==cur);
  const inR=(lo,hi,f)=>pool.filter(t=>t.p>=lo&&t.p<=hi&&(!f||f(t)));
  let A=[],w=0;while(A.length<2&&w<15){A=inR(Math.min(tgt-1,86)-w,tgt+5+w);w++}
  const a=wpick(A,t=>Math.pow(LG[t.lg].coef,2)*(t.p>=o?1.5:1)*(LG[t.lg].tier===1?1:.4));
  const late=age>=31;
  const f=t=>t.n!==a.n&&(late||age>25||t.pot>=4);
  let B=[];w=0;while(B.length<1&&w<15){B=inR(tgt-7-w,tgt+1+w,f);w++}
  if(!B.length)B=pool.filter(t=>t.n!==a.n);
  const b=wpick(B,t=>late&&['SAU','QAT','UAE','USA','TUR','MEX'].includes(t.lg)?5:(t.pot+LG[t.lg].coef*2));
  return[mkOffer(a,'Büyük adım'),mkOffer(b,late?'Kariyer finali':'Gelişim & forma süresi')];
}
function addT(cat,name,year,club){P.trophies.push({cat,name,year,club})}

function playSeason(){
  const i=P.seasons.length,Y=2026+i,endY=Y+1,age=P.age;
  const t=teamOf(P.team.n,P.team.lg),l=LG[t.lg],pos=POS[P.pos];
  const avgP=avgPow(l),rel=P.ovr-t.p,share=sig((rel+3)/2.5);
  const injured=R()<.12,fit=injured?rnd(.4,.75):1;
  const s=t.p+clamp(rel*pos.w,-1.5,6)*(.4+.6*share);
  const comp=compFor(t);
  // lig
  const tbl=l.teams.map(x=>({n:x.n,s:(x.n===t.n?s:x.p)+gauss()*2.2})).sort((a,b)=>b.s-a.s);
  tbl.forEach((x,k)=>P.prevRank[x.n]=k+1);
  const rank=tbl.findIndex(x=>x.n===t.n)+1;
  const lApps=Math.round(l.games*clamp(.22+.74*share,0,.97)*fit);
  const trophies=[];
  if(rank===1){addT('league',l.n,endY,t.n);trophies.push(l.n)}
  // kupa
  const cb=l.top?LG[l.top]:l,tp=topPow(cb);
  const cup=simKO(s,[tp-12,tp-8,tp-5,tp-3,tp-2],CUP_ELIM,[1,1,1,1,1],3.5);
  if(cup.won){addT('cup',l.cup,endY,t.n);trophies.push(l.cup)}
  const play=x=>Math.round(x*clamp(share+.12,0,1)*fit);
  let apps=lApps+play(cup.m);
  // kıta kupası
  let euro=null;
  if(comp){const r=simKO(s,comp.st,EURO_ELIM,[8,2,2,2,1]);euro={n:comp.n,txt:r.txt,won:r.won,k:comp.k};apps+=play(r.m);
    if(r.won){addT('cont',comp.n,endY,t.n);trophies.push(comp.n);if(comp.k==='top')P.contWins.push({y:endY,t:t.n})}}
  // kulüpler dünya kupası
  let cwc=null;
  if((endY-2029)%4===0&&endY>=2029&&P.contWins.some(c=>c.t===t.n&&c.y>endY-4)){
    const r=simKO(s,[78,82,85,87],['Grupta elendi','Çeyrek finalde elendi','Yarı finalde elendi','Finalde kaybetti'],[3,1,1,1]);
    cwc={n:'FIFA Kulüpler Dünya Kupası',txt:r.txt,won:r.won};apps+=play(r.m);
    if(r.won){addT('cwc',cwc.n,endY,t.n);trophies.push(cwc.n)}}
  // istatistik
  const mf=.5+.5*share;
  const qual=Math.pow(P.ovr/80,3)*clamp(1+(P.ovr-avgP)/45+(t.p-avgP)/55,.6,1.22);
  const goals=Math.max(0,Math.round(apps*mf*pos.g*qual*(1+gauss()*.15)));
  const assists=Math.max(0,Math.round(apps*mf*pos.a*qual*(1+gauss()*.18)));
  const cs=pos.att?0:Math.round(apps*clamp(.22+(t.p-avgP)/35,.08,.55)*(.8+.2*share));
  const ga=(goals+assists*.7)/Math.max(apps,1);
  const att=pos.att?ga*1.1:ga*1.6+(cs/Math.max(apps,1))*1.3;
  const avg=+clamp(6.5+(P.ovr-70)*.03+clamp(rel*.02,-.25,.15)+att+(rank===1?.12:0)+gauss()*.12,5.8,9.4).toFixed(2);
  let boot=false;
  if(pos.att&&apps>0){const lg=goals*lApps/apps;if(lg>=l.games*.6+gauss()*2.5){boot=true;addT('boot','Gol Kralı · '+l.n,endY,t.n);trophies.push('Gol Kralı')}}
  // milli takım
  const nat=NAT[P.nat];
  const called=age>=18&&P.ovr>=nat.s-7;
  let caps=called?Math.max(1,ri(4,8)-(injured?2:0)):0,ngoals=0,tourn=null;
  const ns=nat.s+clamp((P.ovr-nat.s)*.3,-1,4);
  if(called&&endY%4===2){
    if(R()<sig((nat.s-70)/3)){const r=simKO(ns,WC.st,WC.elim,WC.mp,3.4);tourn={n:WC.n+' '+endY,txt:r.txt,won:r.won,wc:1};caps+=r.m;if(r.won){addT('wc',WC.n,endY,P.nat);trophies.push(WC.n)}}
    else tourn={n:WC.n+' '+endY,txt:'Elemelerde kaldı',won:false,wc:1};
  }else if(called&&endY%4===0){
    const c=CONT[nat.conf];
    if(R()<sig((nat.s-66)/3)){const r=simKO(ns,c.st,c.elim,c.mp,3.4);tourn={n:c.n+' '+endY,txt:r.txt,won:r.won};caps+=r.m;if(r.won){addT('natc',c.n,endY,P.nat);trophies.push(c.n)}}
    else tourn={n:c.n+' '+endY,txt:'Elemelerde kaldı',won:false};
  }
  if(caps)ngoals=Math.max(0,Math.round(caps*pos.g*.75*Math.pow(P.ovr/80,3)*(1+gauss()*.25)));
  // Ballon d'Or
  let bdo=null;
  if(P.ovr>=82){
    const lc=l.coef;
    let sc=(goals+assists*.6)*(.55+.45*lc)+(avg-7)*25+(P.ovr-84)*2.5+cs*.8*lc;
    if(rank===1)sc+=14*lc; if(cup.won)sc+=5*lc;
    if(euro){const c=(COMPS[l.conf].find(x=>x.n===euro.n)||{w:0}).w;sc+=euro.won?c:euro.txt==='Finalde kaybetti'?c*.3:0}
    if(cwc&&cwc.won)sc+=6;
    if(tourn){if(tourn.won)sc+=tourn.wc?40:CONT[nat.conf].w;else if(tourn.txt==='Finalde kaybetti')sc+=tourn.wc?12:6}
    sc*=P.pos==='KL'||P.pos==='STP'?.72:P.pos==='MO'?.85:1;
    const th=112+gauss()*10,d=th-sc;
    const rk=d<=0?1:1+Math.ceil(d/7);
    if(rk<=30)bdo=rk;
    if(bdo===1){addT('bdo',"Ballon d'Or",endY,t.n);trophies.unshift("Ballon d'Or")}
  }
  // gelişim
  const before=P.ovr;
  P.ovr=applyG(P.ovr,growth(age,rel,t.pot,avg,false),P.pot);
  P.seasons.push({label:Y+'/'+String(endY).slice(2),endY,age,club:t.n,lg:l.id,lgName:l.n,before,after:P.ovr,apps,goals,assists,cs,avg,rank,size:l.teams.length,
    cup:{n:l.cup,txt:cup.txt,won:cup.won},euro,cwc,caps,ngoals,tourn,bdo,boot,injured,trophies,value:mv(P.ovr,age+1)});
  P.age++;
  if(P.age>38){P.done=true;OFFERS=null}
  else if(P.seasons.length%2===0)OFFERS=makeOffers();
  save();
}

/* ================= ekranlar ================= */
function renderStart(){
  const saved=load();
  const nats=NATIONS.map(n=>`<option${n.n==='Türkiye'?' selected':''}>${esc(n.n)}</option>`).join('');
  const groups={};LEAGUES.forEach(l=>{(groups[l.c]=groups[l.c]||[]).push(l)});
  const lgs=Object.keys(groups).map(c=>`<optgroup label="${esc(c)}">${groups[c].map(l=>`<option value="${l.id}"${l.id==='TUR'?' selected':''}>${esc(l.n)}</option>`).join('')}</optgroup>`).join('');
  const poss=Object.keys(POS).map(k=>`<option value="${k}">${POS[k].n}</option>`).join('');
  $('#app').innerHTML=`<section class="col card" style="display:grid;gap:16px">
    <h2 style="font-size:30px">Yeni kariyer</h2>
    <form id="f" class="form">
      <label>Ad soyad<input id="pname" value="Kerem Aydın" maxlength="28" autocomplete="off"></label>
      <label>Uyruk<select id="pnat">${nats}</select></label>
      <label>Mevki<select id="ppos">${poss}</select></label>
      <label>Başlangıç ligi<select id="plg">${lgs}</select></label>
    </form>
    <div class="btns">
      <button class="btn primary" id="go">Başla</button>
      ${saved&&!saved.P.done?`<button class="btn" id="cont">Devam et (${esc(saved.P.name)}, ${saved.P.age})</button>`:''}
    </div>
  </section>`;
  $('#go').onclick=()=>{
    P=newCareer(($('#pname').value||'').trim()||'İsimsiz Yıldız',$('#pnat').value,$('#ppos').value);
    OFFERS=startOffers($('#plg').value);renderGame();
  };
  $('#f').onsubmit=e=>{e.preventDefault();$('#go').click()};
  if($('#cont'))$('#cont').onclick=()=>{P=saved.P;OFFERS=saved.OFFERS;renderGame()};
}

function totals(){
  const t={apps:0,goals:0,assists:0};
  P.seasons.forEach(s=>{t.apps+=s.apps;t.goals+=s.goals;t.assists+=s.assists});
  t.trophies=P.trophies.filter(x=>x.cat!=='bdo'&&x.cat!=='boot').length;
  t.bdo=P.trophies.filter(x=>x.cat==='bdo').length;
  return t;
}

function renderGame(){
  if(P.done)return renderEnd();
  const t=P.team?teamOf(P.team.n,P.team.lg):null,l=t?LG[t.lg]:null,tt=totals();
  const n=P.seasons.length,Y=2026+n,s=P.seasons[n-1];
  const def=!(POS[P.pos].att||P.pos==='MO');
  $('#app').innerHTML=`<section class="col">
    <div class="pcard">
      <div class="prow">
        <div class="ovr">${Math.round(P.ovr)}</div>
        <div style="min-width:0"><div class="pname">${esc(P.name)}</div>
          <div class="meta">${P.age} yaş · ${esc(POS[P.pos].n)}${t?' · '+esc(t.n):''}</div></div>
      </div>
      <div class="tiles">
        <div class="tile"><b>${tt.apps}</b><span>Maç</span></div>
        <div class="tile"><b>${tt.goals}</b><span>Gol</span></div>
        <div class="tile"><b>${tt.assists}</b><span>Asist</span></div>
        <div class="tile"><b>${tt.trophies}</b><span>Kupa</span></div>
      </div>
      ${t?`<div class="btns">
        <button class="btn primary" id="play">${Y}/${String(Y+1).slice(2)} sezonunu oyna</button>
        <button class="btn" id="fast">Transfere kadar oyna</button>
      </div>`:''}
    </div>
    ${s?`<div class="card season">
      <div class="shead"><h2>${s.label}</h2><span class="eyebrow">${esc(s.club)}</span></div>
      <div class="sline">${s.apps} maç · ${def?s.cs+' gol yemeden':s.goals+' gol · '+s.assists+' asist'} · ${s.rank===1?'Lig şampiyonu':'Lig '+s.rank+'.'}${s.bdo&&s.bdo>1?" · Ballon d'Or "+s.bdo+'.':''}</div>
      ${s.trophies.length?`<div class="chips">${s.trophies.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
    </div>`:''}
    <button class="btn link" id="reset">Yeni kariyer</button>
  </section>`;
  if($('#play'))$('#play').onclick=()=>{playSeason();renderGame()};
  if($('#fast'))$('#fast').onclick=()=>{do{playSeason()}while(!OFFERS&&!P.done);renderGame()};
  $('#reset').onclick=e=>{
    const b=e.currentTarget;
    if(b.dataset.c){clearSave();P=null;OFFERS=null;renderStart();return}
    b.dataset.c=1;b.textContent='Silmek için tekrar bas';
  };
  if(OFFERS)renderOffers();
}

function renderOffers(){
  const first=!P.team;
  const ov=document.createElement('div');
  ov.className='overlay';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  ov.innerHTML=`<div class="win col">
    <h2>${first?'İlk kulübünü seç':'Transfer dönemi'}</h2>
    <div class="offers">${OFFERS.map((o,i)=>`<button class="offer" data-pick="${i}">
      <span class="oname">${esc(o.n)}</span>
      <span class="meta">${esc(LG[o.lg].n)}</span>
      <span class="ofee"><small>Transfer bedeli</small>${eur(o.fee)}</span>
    </button>`).join('')}</div>
    ${first?'':`<button class="btn" id="stay">${esc(P.team.n)} kulübünde kal</button>`}
  </div>`;
  document.body.appendChild(ov);
  const Y=2026+P.seasons.length;
  ov.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const o=OFFERS[+b.dataset.pick];
    P.moves.push({y:Y,from:P.team?P.team.n:null,to:o.n,fee:o.fee,start:o.start});
    P.team={n:o.n,lg:o.lg};OFFERS=null;save();ov.remove();renderGame();window.scrollTo(0,0);
  });
  if($('#stay'))$('#stay').onclick=()=>{OFFERS=null;save();ov.remove();renderGame()};
  ov.querySelector('[data-pick]').focus({preventScroll:true});
}

/* ================= kariyer sonu ================= */
function renderEnd(){
  const tt=totals(),T=P.trophies;
  const group=list=>{const g={};list.forEach(x=>{(g[x.name]=g[x.name]||[]).push(x.year)});return g};
  const order=['wc','natc','cont','cwc','league','cup'];
  const team=order.flatMap(c=>T.filter(x=>x.cat===c));
  const bdo=T.filter(x=>x.cat==='bdo'),boot=T.filter(x=>x.cat==='boot');
  const best=P.seasons.reduce((m,s)=>s.bdo&&(!m||s.bdo<m)?s.bdo:m,null);
  const ucl=T.filter(x=>x.name==='UEFA Şampiyonlar Ligi').length,wc=T.filter(x=>x.cat==='wc').length;
  const pts=bdo.length*10+wc*9+ucl*4+T.filter(x=>x.cat==='natc').length*4+T.filter(x=>x.cat==='league').length*1.5+tt.goals/40;
  const legacy=pts>=70?'Tüm zamanların en iyisi':pts>=40?'Futbol efsanesi':pts>=20?'Dünya yıldızı':pts>=9?'Kulüp efsanesi':'Saygın bir profesyonel';
  const rows=g=>Object.keys(g).map(k=>`<div class="row"><b>${g[k].length}</b><div><strong>${esc(k)}</strong><small>${g[k].join(', ')}</small></div></div>`).join('');
  const ind={};
  if(bdo.length)ind["Ballon d'Or"]=bdo.map(x=>x.year);
  boot.forEach(x=>{(ind['Gol Kralı']=ind['Gol Kralı']||[]).push(x.year)});
  $('#app').innerHTML=`<section class="col">
    <div class="endhero">
      <div class="eyebrow">Kariyer bitti · 38 yaş</div>
      <h1>${esc(P.name)}</h1>
      <div class="legacy">${legacy}</div>
    </div>
    <div class="tiles">
      <div class="tile"><b>${num(tt.apps)}</b><span>Maç</span></div>
      <div class="tile"><b>${num(tt.goals)}</b><span>Gol</span></div>
      <div class="tile"><b>${num(tt.assists)}</b><span>Asist</span></div>
      <div class="tile"><b>${tt.bdo}</b><span>Ballon d'Or</span></div>
    </div>
    <h2 class="sh">Bireysel başarılar</h2>
    ${Object.keys(ind).length?`<div class="cab">${rows(ind)}</div>`:`<p class="note">${best?"Ballon d'Or'da en iyi sıran: "+best+'.':'Bireysel ödül yok.'}</p>`}
    <h2 class="sh">Kupalar (${team.length})</h2>
    ${team.length?`<div class="cab">${rows(group(team))}</div>`:'<p class="note">Kupa kazanılmadı.</p>'}
    <button class="btn primary" id="again">Yeni kariyer</button>
  </section>`;
  $('#again').onclick=()=>{clearSave();P=null;OFFERS=null;renderStart();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}

renderStart();
</script>
</body></html>
